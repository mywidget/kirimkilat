<!doctype html>
<html lang="id" class="w-full max-w-full overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Ignore harmless Vite HMR WebSocket closing messages in preview environment
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          const msg = args.map(function(a) { return (typeof a === 'object' && a && a.message) ? a.message : String(a); }).join(' ');
          if (msg.includes('WebSocket') || msg.includes('[vite]')) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          const msg = e.message || (e.error && e.error.message) || '';
          if (msg.includes('WebSocket') || msg.includes('vite')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          const reason = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (reason.includes('WebSocket') || reason.includes('vite')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
      })();
    </script>

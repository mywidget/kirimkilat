    <meta charset="UTF-8" />
    <script>
      // Mock Vite HMR WebSocket connection to prevent "WebSocket closed without opened" in preview environment
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          const PatchedWebSocket = function(url, protocols) {
            const isViteHmr = (typeof protocols === 'string' && (protocols === 'vite-hmr' || protocols === 'vite-ping'))
              || (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping')))
              || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')));

            if (isViteHmr) {
              const target = new EventTarget();
              const dummy = {
                readyState: 1, // WebSocket.OPEN
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                url: String(url),
                protocol: typeof protocols === 'string' ? protocols : 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: target.addEventListener.bind(target),
                removeEventListener: target.removeEventListener.bind(target),
                dispatchEvent: target.dispatchEvent.bind(target),
                set onopen(fn) { target.addEventListener('open', fn); },
                set onclose(fn) { target.addEventListener('close', fn); },
                set onmessage(fn) { target.addEventListener('message', fn); },
                set onerror(fn) { target.addEventListener('error', fn); },
              };
              setTimeout(function() {
                try {
                  target.dispatchEvent(new Event('open'));
                  // Send standard Vite HMR connected payload so @vite/client does not initiate reload
                  target.dispatchEvent(new MessageEvent('message', {
                    data: JSON.stringify({ type: 'connected' })
                  }));
                } catch (_) {}
              }, 0);
              return dummy;
            }
            return new OrigWebSocket(url, protocols);
          };
          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          PatchedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = OrigWebSocket.OPEN;
          PatchedWebSocket.CLOSING = OrigWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }

        const origError = console.error;
        console.error = function(...args) {
          const msg = args.map(function(a) { return (typeof a === 'object' && a && a.message) ? a.message : String(a); }).join(' ');
          if (msg.includes('WebSocket') || msg.includes('[vite]')) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          const msg = e.message || (e.error && e.error.message) || '';
          if (msg.includes('WebSocket') || msg.includes('vite')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          const reason = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (reason.includes('WebSocket') || reason.includes('vite')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
      })();

      // PWA: Capture native beforeinstallprompt immediately on page load
      window.__deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPWAInstallPrompt = e;
        try {
          window.dispatchEvent(new Event('pwa-prompt-ready'));
        } catch (_) {}
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredPWAInstallPrompt = null;
        try {
          window.dispatchEvent(new Event('pwa-app-installed'));
        } catch (_) {}
      });
    </script>
